<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>word 工厂 · GUI 布局（SVG 版）</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 14px/1.6 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    color: #1f2933; background: #eef1f5; display: flex; flex-direction: column;
  }
  header { background: #fff; border-bottom: 1px solid #d7dee8; padding: 10px 16px;
           display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0 6px 0 0; font-weight: 600; }
  header .hint { color: #64748b; font-size: 12px; }
  .toolbar { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; align-items: center; }
  button, select { font: inherit; padding: 6px 12px; border-radius: 6px; cursor: pointer;
                   border: 1px solid #c7d0dd; background: #fff; color: #1f2933; }
  button:hover { background: #f4f7fb; }
  button.primary { background: #2f6fed; border-color: #2f6fed; color: #fff; }
  button.primary:hover { background: #2a62d4; }
  button.ghost { border-style: dashed; color: #64748b; }
  main { flex: 1; display: flex; min-height: 0; }
  #palette { width: 218px; background: #fff; border-right: 1px solid #d7dee8;
             overflow: auto; padding: 12px; }
  #palette h2 { font-size: 12px; color: #64748b; margin: 14px 0 6px; font-weight: 600; }
  .chip { display: block; width: 100%; text-align: left; margin-bottom: 6px; font: inherit;
          color: #1f2933; border: 1px solid #d7dee8; background: #fbfcfe; border-radius: 6px;
          padding: 7px 10px; cursor: pointer; }
  .chip:hover { background: #eef4ff; border-color: #b9cdf5; }
  .chip small { color: #8a97a8; display: block; font-size: 11px; }
  #stage-wrap { flex: 1; overflow: auto; padding: 16px; background: #e9edf3; }
  #stage-box { position: relative; margin: 0 auto; }
  #stage { display: block; background: #fff; box-shadow: 0 1px 4px rgba(31,41,51,.12); }
  #inspector { width: 262px; background: #fff; border-left: 1px solid #d7dee8;
               padding: 14px; overflow: auto; }
  #inspector h2 { font-size: 12px; color: #64748b; margin: 0 0 10px; }
  #inspector label { display: block; font-size: 12px; color: #64748b; margin: 10px 0 4px; }
  #inspector input[type=text], #inspector input[type=number] {
    width: 100%; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; }
  #inspector .empty { color: #9aa7b8; font-size: 12px; }
  #inspector textarea { width: 100%; padding: 6px 8px; border: 1px solid #cbd5e1;
                        border-radius: 6px; font: inherit; }
  footer { background: #fff; border-top: 1px solid #d7dee8; padding: 8px 16px;
           color: #64748b; font-size: 12px; display: flex; gap: 16px; flex-wrap: wrap; }
  code { background: #f1f5f9; padding: 1px 5px; border-radius: 4px; }
  .guide { stroke: #f05f6b; stroke-width: 1; stroke-dasharray: 4 3; }
</style>
</head>
<body>
<header>
  <h1>word 工厂 · GUI 布局</h1>
  <span class="hint">SVG 画布 1440×900（= 软件窗口外框）｜ 元件画成真实控件的样子，拖一下、拉一下大小</span>
  <div class="toolbar">
    <select id="preset" title="从现成骨架开始">
      <option value="">— 预设布局 —</option>
      <option value="sidebar">左栏 + 主区</option>
      <option value="toolbar">顶部工具条 + 主区</option>
      <option value="wizard">单列向导式</option>
      <option value="blank">空白</option>
    </select>
    <button id="undo" class="ghost">撤销</button>
    <button id="clear" class="ghost">清空</button>
    <button id="zoomout">−</button><button id="zoomin">＋</button><button id="zoomfit">适应</button>
    <button id="export">导出布局</button>
    <button id="import" class="ghost">导入</button>
    <button id="approve" class="primary">就是它了（存下这版）</button>
  </div>
</header>

<main>
  <aside id="palette">
    <h2>点一下就把元件加到画布中间</h2>
    <button class="chip" data-add="zone" data-w="260" data-h="300">分区 / 面板<small>侧栏、主工作区</small></button>
    <button class="chip" data-add="button" data-w="130" data-h="34">按钮<small>运行 / 出验证版…</small></button>
    <button class="chip" data-add="tab" data-w="120" data-h="34">标签页</button>
    <button class="chip" data-add="checkbox" data-w="120" data-h="28">复选框</button>
    <button class="chip" data-add="select" data-w="160" data-h="34">下拉选择</button>
    <button class="chip" data-add="list" data-w="240" data-h="180">清单<small>可勾选 + 拖排序</small></button>
    <button class="chip" data-add="table-list" data-w="280" data-h="200">表格清单<small>按表头勾选哪几张套模板</small></button>
    <button class="chip" data-add="style-picker" data-w="240" data-h="150">模板选择器<small>6 个表格模板</small></button>
    <button class="chip" data-add="preview" data-w="240" data-h="160">预览窗<small>套用后的样子</small></button>
    <button class="chip" data-add="log" data-w="420" data-h="110">运行日志<small>改了多少处</small></button>
    <h2>操作提示</h2>
    <div style="font-size:12px;color:#64748b">
      拖动移动（自动吸附 8px 网格；靠近别的元件边缘会出红色参考线）<br>
      右下角小方块拉大小<br>
      方向键微调 1 单位，按 <code>Shift</code> 一次 10<br>
      <code>Delete</code> 删除 · <code>Ctrl+Z</code> 撤销
    </div>
  </aside>

  <div id="stage-wrap">
    <div id="stage-box">
      <svg id="stage" width="1440" height="900" viewBox="0 0 1440 900"
           xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>

  <aside id="inspector">
    <h2>属性</h2>
    <div id="inspector-body" class="empty">点画布里的元件 → 这里改文字/位置/大小</div>
    <h2 style="margin-top:18px">备注（会一起导出）</h2>
    <textarea id="notes" rows="5" placeholder="想改哪儿写这儿，比如：表格清单要显示行数 / 运行日志要能折叠…"></textarea>
  </aside>
</main>

<footer>
  <span>画布 1440×900 ｜ 1 单位 = 1 像素</span>
  <span id="status">画布是空的</span>
  <span>自动保存在浏览器里</span>
</footer>

<script>
'use strict';
const STAGE = document.getElementById('stage');
const STATUS = document.getElementById('status');
const INSPECTOR = document.getElementById('inspector-body');
const GRID = 8, CW = 1440, CH = 900;
const SVGNS = 'http://www.w3.org/2000/svg';

let items = [], selected = null, history = [], seq = 1, zoom = 1;

const TYPE_LABEL = {
  zone: '分区/面板', button: '按钮', tab: '标签页', checkbox: '复选框', select: '下拉选择',
  list: '清单', 'table-list': '表格清单', 'style-picker': '模板选择器', preview: '预览窗',
  log: '运行日志',
};
const DEFAULT_TEXT = {
  zone: '分区 / 面板', button: '按钮', tab: '标签页', checkbox: '复选框',
  select: '请选择', list: '清单（勾选 + 拖排序）', 'table-list': '按表头勾选表格',
  'style-picker': '表格模板', preview: '预览窗', log: '运行日志',
};

/* ---------------------------------------------------------------- SVG 小工具 */
function el(name, attrs, text) {
  const node = document.createElementNS(SVGNS, name);
  for (const key in (attrs || {})) {
    if (attrs[key] !== undefined && attrs[key] !== null) node.setAttribute(key, attrs[key]);
  }
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}

/** 把一个元件画成"真实控件的样子" —— 所见即所得：画布上看到的就是真界面的样子。 */
function paint(item) {
  const accent = item.id === selected;
  const isPanel = ['zone', 'preview', 'log', 'table-list', 'style-picker', 'list'].includes(item.type);
  const group = el('g', {'data-id': item.id, cursor: 'move'});
  group.appendChild(el('rect', {
    x: item.x, y: item.y, width: item.w, height: item.h,
    rx: (item.type === 'button' || item.type === 'tab') ? 6 : 4,
    fill: isPanel ? '#fbfcfe' : '#ffffff',
    stroke: accent ? '#2f6fed' : '#cbd5e1', 'stroke-width': accent ? 2 : 1,
    'stroke-dasharray': item.type === 'zone' ? '5 3' : undefined,
  }));

  if (item.type === 'table-list') {
    group.appendChild(el('rect', {x: item.x, y: item.y, width: item.w, height: 26,
                                  fill: '#f1f5fb'}));
    group.appendChild(el('text', {x: item.x + 10, y: item.y + 18, 'font-size': 12,
                                  fill: '#334155'}, item.text));
    ['☑ 水位（m） / 库容（万m3）', '☑ 序号 / 高程 / 面积',
     '☐ 设计频率 / P=3.3% / P=0.33%', '☐ 项目 / 特性指标 / 单位'].forEach((row, index) =>
      group.appendChild(el('text', {x: item.x + 10, y: item.y + 46 + index * 22,
                                    'font-size': 12, fill: '#475569'}, row)));
  } else if (item.type === 'style-picker') {
    group.appendChild(el('text', {x: item.x + 10, y: item.y + 18, 'font-size': 12,
                                  fill: '#334155'}, item.text));
    const cellW = (item.w - 20) / 3 - 6, cellH = (item.h - 36) / 2 - 5;
    ['外粗内细', '全居中', '均布列宽', '自适应', '三线表', '三线表·均布'].forEach((name, index) => {
      const cx = item.x + 10 + (index % 3) * (cellW + 6);
      const cy = item.y + 32 + Math.floor(index / 3) * (cellH + 5);
      group.appendChild(el('rect', {x: cx, y: cy, width: cellW, height: cellH, rx: 3,
                                    fill: '#fff', stroke: '#d7dee8'}));
      group.appendChild(el('text', {x: cx + cellW / 2, y: cy + cellH / 2 + 4, 'font-size': 11,
                                    fill: '#475569', 'text-anchor': 'middle'}, name));
    });
  } else if (item.type === 'preview') {
    group.appendChild(el('text', {x: item.x + 10, y: item.y + 18, 'font-size': 12,
                                  fill: '#334155'}, item.text));
    const tx = item.x + 10, ty = item.y + 34, tw = item.w - 20;
    group.appendChild(el('rect', {x: tx, y: ty, width: tw, height: 24, fill: '#fff',
                                  stroke: '#94a3b8'}));
    group.appendChild(el('line', {x1: tx, y1: ty + 24, x2: tx + tw, y2: ty + 24,
                                  stroke: '#111827', 'stroke-width': 1.5}));
    group.appendChild(el('text', {x: tx + tw / 4, y: ty + 17, 'font-size': 11,
                                  'text-anchor': 'middle'}, '项目'));
    group.appendChild(el('text', {x: tx + tw * 0.75, y: ty + 17, 'font-size': 11,
                                  'text-anchor': 'middle'}, '说明'));
    group.appendChild(el('text', {x: tx + tw / 4, y: ty + 42, 'font-size': 11,
                                  'text-anchor': 'middle'}, '防洪标准'));
    group.appendChild(el('text', {x: tx + tw * 0.75, y: ty + 42, 'font-size': 11}, '按50年一遇设计、200年一遇校核…'));
  } else if (item.type === 'log') {
    group.appendChild(el('text', {x: item.x + 10, y: item.y + 18, 'font-size': 12,
                                  fill: '#334155'}, item.text));
    ['· 表格 12 张，改了 12 张（131 处）',
     '· 单元格对齐(left) 9 处 ｜ 框线 12 处 ｜ 表头折行 1 处'].forEach((line, index) =>
      group.appendChild(el('text', {x: item.x + 10, y: item.y + 40 + index * 20,
                                    'font-size': 11, fill: '#64748b',
                                    'font-family': 'Consolas, monospace'}, line)));
  } else if (item.type === 'list') {
    group.appendChild(el('text', {x: item.x + 10, y: item.y + 18, 'font-size': 12,
                                  fill: '#334155'}, item.text));
    ['☑ 格式规范化', '☑ 表格款式', '☐ 段落配方', '☐ 体检 AUDIT'].forEach((row, index) =>
      group.appendChild(el('text', {x: item.x + 10, y: item.y + 38 + index * 20,
                                    'font-size': 11, fill: '#475569'}, row)));
  } else if (item.type === 'checkbox') {
    group.appendChild(el('rect', {x: item.x, y: item.y + 5, width: 14, height: 14, rx: 2,
                                  fill: '#fff', stroke: '#64748b'}));
    group.appendChild(el('text', {x: item.x + 20, y: item.y + 18, 'font-size': 13}, item.text));
  } else if (item.type === 'select') {
    group.appendChild(el('rect', {x: item.x, y: item.y, width: item.w, height: item.h,
                                  rx: 4, fill: '#fff', stroke: '#cbd5e1'}));
    group.appendChild(el('text', {x: item.x + 10, y: item.y + 22, 'font-size': 13,
                                  fill: '#475569'}, item.text));
    group.appendChild(el('text', {x: item.x + item.w - 14, y: item.y + 22, 'font-size': 10,
                                  fill: '#94a3b8', 'text-anchor': 'middle'}, '▼'));
  } else if (item.type === 'tab') {
    group.appendChild(el('rect', {x: item.x, y: item.y + 2, width: item.w, height: item.h - 3,
                                  rx: 4, fill: '#fff', stroke: '#cbd5e1'}));
    group.appendChild(el('line', {x1: item.x, y1: item.y + item.h - 1,
                                  x2: item.x + item.w, y2: item.y + item.h - 1,
                                  stroke: '#fff', 'stroke-width': 3}));
    group.appendChild(el('text', {x: item.x + item.w / 2, y: item.y + 23, 'font-size': 13,
                                  'text-anchor': 'middle'}, item.text));
  } else {
    const centered = item.type === 'button';
    group.appendChild(el('text', {
      x: centered ? item.x + item.w / 2 : item.x + 10,
      y: item.y + item.h / 2 + 5, 'font-size': 13,
      'text-anchor': centered ? 'middle' : 'start',
    }, item.text));
  }
  if (item.id === selected) {
    group.appendChild(el('rect', {x: item.x + item.w - 8, y: item.y + item.h - 8,
                                  width: 8, height: 8, fill: '#2f6fed',
                                  cursor: 'nwse-resize', 'data-handle': '1'}));
  }
  return group;
}

function render() {
  STAGE.textContent = '';
  STAGE.appendChild(el('rect', {x: 0, y: 0, width: CW, height: CH,
                                fill: '#fff', stroke: '#94a3b8'}));
  for (let x = 0; x <= CW; x += 80) STAGE.appendChild(
    el('line', {x1: x, y1: 0, x2: x, y2: CH, stroke: '#eef1f5'}));
  for (let y = 0; y <= CH; y += 80) STAGE.appendChild(
    el('line', {x1: 0, y1: y, x2: CW, y2: y, stroke: '#eef1f5'}));
  items.forEach(item => STAGE.appendChild(paint(item)));
  STAGE.appendChild(el('g', {id: 'guides'}));
  STATUS.textContent = items.length ? ('画布上有 %d 个元件').replace('%d', items.length)
                                    : '画布是空的 —— 从左边点一个元件加进来';
  renderInspector();
}

/* ---------------------------------------------------------------- 坐标换算（关键） */
function toSvg(event) {
  const point = STAGE.createSVGPoint();
  point.x = event.clientX;
  point.y = event.clientY;
  return point.matrixTransform(STAGE.getScreenCTM().inverse());
}

/* ---------------------------------------------------------------- 拖动 / 改大小 */
STAGE.addEventListener('mousedown', event => {
  const handle = event.target.getAttribute && event.target.getAttribute('data-handle');
  const group = event.target.closest('g[data-id]');
  if (!group) { selected = null; render(); return; }
  const item = items.find(entry => entry.id === group.getAttribute('data-id'));
  if (!item) return;
  selected = item.id;
  render();
  const start = toSvg(event);
  const origin = {x: item.x, y: item.y, w: item.w, h: item.h};
  let moved = false;

  const move = ev => {
    const point = toSvg(ev);
    moved = true;
    if (handle) {
      item.w = clamp(round8(origin.w + point.x - start.x), 40, CW - item.x);
      item.h = clamp(round8(origin.h + point.y - start.y), 24, CH - item.y);
    } else {
      item.x = clamp(round8(origin.x + point.x - start.x), 0, CW - item.w);
      item.y = clamp(round8(origin.y + point.y - start.y), 0, CH - item.h);
      snap(item);
      drawGuides(item);
    }
    const node = STAGE.querySelector('g[data-id="' + item.id + '"]');
    if (node) {
      node.remove();
      STAGE.insertBefore(paint(item), STAGE.lastChild);
    }
  };
  const up = () => {
    document.removeEventListener('mousemove', move);
    document.removeEventListener('mouseup', up);
    const guides = document.getElementById('guides');
    if (guides) guides.textContent = '';
    render();
    if (moved) pushHistorySoon();
  };
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', up);
});

/** 吸附：靠近别的元件边缘/中线就贴上去（贴的时候画红色参考线）。 */
function snap(item) {
  const guides = [];
  const near = (a, b) => Math.abs(a - b) <= 5;
  for (const other of items) {
    if (other.id === item.id) continue;
    const xs = [other.x, other.x + other.w, (other.x * 2 + other.w) / 2];
    const ys = [other.y, other.y + other.h, (other.y * 2 + other.h) / 2];
    const mineX = [item.x, item.x + item.w, (item.x * 2 + item.w) / 2];
    const mineY = [item.y, item.y + item.h, (item.y * 2 + item.h) / 2];
    xs.forEach(value => mineX.forEach(mine => { if (near(mine, value)) guides.push(['v', value]); }));
    ys.forEach(value => mineY.forEach(mine => { if (near(mine, value)) guides.push(['h', value]); }));
  }
  if (near(item.x, CW / 2)) guides.push(['v', CW / 2]);
  if (near(item.y, CH / 2)) guides.push(['h', CH / 2]);
  for (const guide of guides) {
    const axis = guide[0], value = guide[1];
    if (axis === 'v') item.x = clamp(value, 0, CW - item.w);
    else item.y = clamp(value, 0, CH - item.h);
  }
}

function drawGuides(item) {
  const guides = document.getElementById('guides');
  if (!guides) return;
  guides.textContent = '';
  if (Math.abs(item.x + item.w / 2 - CW / 2) < 2) {
    guides.appendChild(el('line', {x1: CW / 2, y1: 0, x2: CW / 2, y2: CH, class: 'guide'}));
  }
  if (Math.abs(item.y + item.h / 2 - CH / 2) < 2) {
    guides.appendChild(el('line', {x1: 0, y1: CH / 2, x2: CW, y2: CH / 2, class: 'guide'}));
  }
}

function round8(value) { return Math.round(value / GRID) * GRID; }
function clamp(value, low, high) { return Math.max(low, Math.min(high, value)); }

/* ---------------------------------------------------------------- 加元件 */
document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    pushHistory();
    const type = chip.dataset.add;
    const w = +chip.dataset.w, h = +chip.dataset.h;
    const item = {id: 'i' + (seq++), type: type,
                  x: round8(Math.max(0, (CW - w) / 2)), y: round8(Math.max(0, (CH - h) / 2)),
                  w: w, h: h, text: DEFAULT_TEXT[type] || type};
    items.push(item);
    selected = item.id;
    render();
  });
});

/* ---------------------------------------------------------------- 属性面板 */
function renderInspector() {
  const item = items.find(entry => entry.id === selected);
  if (!item) {
    INSPECTOR.className = 'empty';
    INSPECTOR.textContent = '点画布里的元件 → 这里改文字/位置/大小';
    return;
  }
  INSPECTOR.className = '';
  INSPECTOR.innerHTML =
    '<label>类型</label><div><b>' + escapeHtml(TYPE_LABEL[item.type] || item.type) + '</b></div>'
    + '<label>文字</label><input type="text" id="f-text" value="' + escapeHtml(item.text) + '">'
    + '<label>X</label><input type="number" id="f-x" value="' + item.x + '" step="8">'
    + '<label>Y</label><input type="number" id="f-y" value="' + item.y + '" step="8">'
    + '<label>宽</label><input type="number" id="f-w" value="' + item.w + '" step="8">'
    + '<label>高</label><input type="number" id="f-h" value="' + item.h + '" step="8">'
    + '<div style="margin-top:12px"><button id="f-del" class="ghost">删除这个元件</button></div>';
  const bind = (id, key, parse) => document.getElementById(id).addEventListener('input', e => {
    item[key] = parse ? parse(e.target.value) : e.target.value;
    render();
  });
  bind('f-text', 'text');
  bind('f-x', 'x', v => clamp(round8(+v || 0), 0, CW - item.w));
  bind('f-y', 'y', v => clamp(round8(+v || 0), 0, CH - item.h));
  bind('f-w', 'w', v => clamp(round8(+v || 0), 40, CW - item.x));
  bind('f-h', 'h', v => clamp(round8(+v || 0), 24, CH - item.y));
  document.getElementById('f-del').addEventListener('click', () => {
    pushHistory();
    items = items.filter(entry => entry.id !== selected);
    selected = null;
    render();
  });
}

function escapeHtml(text) {
  return String(text === undefined || text === null ? '' : text)
    .replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
}

/* ---------------------------------------------------------------- 键盘 */
document.addEventListener('keydown', event => {
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;
  const item = items.find(entry => entry.id === selected);
  if (!item) return;
  const step = event.shiftKey ? GRID * 10 : GRID;
  const moves = {ArrowLeft: [-step, 0], ArrowRight: [step, 0],
                 ArrowUp: [0, -step], ArrowDown: [0, step]};
  if (moves[event.key]) {
    event.preventDefault();
    item.x = clamp(item.x + moves[event.key][0], 0, CW - item.w);
    item.y = clamp(item.y + moves[event.key][1], 0, CH - item.h);
    render();
  } else if (event.key === 'Delete') {
    items = items.filter(entry => entry.id !== selected);
    selected = null;
    render();
  } else if (event.key === 'z' && (event.ctrlKey || event.metaKey)) {
    event.preventDefault();
    undo();
  }
});

/* ---------------------------------------------------------------- 缩放 */
function setZoom(value) {
  zoom = clamp(value, 0.25, 2);
  STAGE.setAttribute('width', CW * zoom);
  STAGE.setAttribute('height', CH * zoom);
}
document.getElementById('zoomin').addEventListener('click', () => setZoom(zoom + 0.15));
document.getElementById('zoomout').addEventListener('click', () => setZoom(zoom - 0.15));
document.getElementById('zoomfit').addEventListener('click', () => setZoom(1));

/* ---------------------------------------------------------------- 工具 */
let historyTimer = null;
function pushHistorySoon() {
  clearTimeout(historyTimer);
  historyTimer = setTimeout(() => { history.push(JSON.stringify(items)); }, 400);
}
function pushHistory() {
  history.push(JSON.stringify(items));
  if (history.length > 80) history.shift();
}
function undo() {
  if (!history.length) return;
  items = JSON.parse(history.pop());
  selected = null;
  render();
}
function save() {
  localStorage.setItem('wordfactory-svg-layout', JSON.stringify(
    {layout: items, notes: document.getElementById('notes').value, zoom: zoom}));
}
function load() {
  try {
    const raw = localStorage.getItem('wordfactory-svg-layout');
    if (!raw) return;
    const data = JSON.parse(raw);
    items = data.layout || [];
    if (data.notes) document.getElementById('notes').value = data.notes;
    if (data.zoom) setZoom(data.zoom);
    seq = nextSeq();
    renumber();
  } catch (error) {
    items = [];
  }
}
function nextSeq() {
  let max = 0;
  items.forEach(item => {
    const n = parseInt(String(item.id || '').replace(/\D/g, ''), 10);
    if (!isNaN(n) && n > max) max = n;
  });
  return max + 1;
}
function renumber() {
  const seen = new Set();
  items.forEach(item => {
    if (!item.id || seen.has(item.id)) item.id = 'i' + (seq++);
    seen.add(item.id);
  });
}

document.getElementById('undo').addEventListener('click', undo);
document.getElementById('clear').addEventListener('click', () => {
  if (!confirm('清空画布上所有元件？')) return;
  pushHistory();
  items = [];
  selected = null;
  render();
});
document.getElementById('export').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(
    {layout: items, notes: document.getElementById('notes').value}, null, 2)],
    {type: 'application/json'});
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'wordfactory-gui-layout.json';
  link.click();
  URL.revokeObjectURL(link.href);
});
document.getElementById('import').addEventListener('click', () => {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.addEventListener('change', () => {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        pushHistory();
        const data = JSON.parse(reader.result);
        items = data.layout || [];
        if (data.notes) document.getElementById('notes').value = data.notes;
        seq = nextSeq();
        renumber();
        selected = null;
        render();
      } catch (error) {
        alert('这个 JSON 读不动：' + error.message);
      }
    };
    reader.readAsText(file);
  });
  input.click();
});
document.getElementById('approve').addEventListener('click', () => {
  save();
  alert('已存下这版（浏览器里也记住）。\n\n点「导出布局」把 JSON 发我，我照它做真界面。');
});

document.getElementById('preset').addEventListener('change', event => {
  const kind = event.target.value;
  if (!kind) return;
  pushHistory();
  items = [];
  seq = 1;
  const add = (type, x, y, w, h, text) => items.push(
    {id: 'i' + (seq++), type: type, x: x, y: y, w: w, h: h, text: text});
  if (kind === 'sidebar') {
    add('zone', 20, 60, 220, 400, '侧栏：宏库 / 表格 / 规则 / 体检');
    add('zone', 260, 60, 700, 220, '主工作区');
    add('list', 280, 240, 260, 180, '宏清单（勾选 + 拖排序）');
    add('preview', 560, 240, 240, 180, '预览窗');
    add('log', 260, 440, 700, 110, '运行日志');
    add('button', 990, 70, 130, 34, '运行（dry-run）');
    add('button', 990, 130, 130, 34, '出验证版');
    add('button', 990, 190, 130, 34, '出正式版');
    add('button', 990, 250, 130, 34, '体检 AUDIT');
  } else if (kind === 'toolbar') {
    add('zone', 20, 60, 1400, 60, '顶部工具条');
    add('tab', 40, 70, 130, 34, '格式规范化');
    add('tab', 190, 70, 130, 34, '表格款式');
    add('tab', 340, 70, 130, 34, '段落配方');
    add('tab', 490, 70, 130, 34, '规则文件');
    add('zone', 20, 150, 900, 380, '主工作区');
    add('zone', 940, 150, 480, 380, '右侧：日志 / 预览');
  } else if (kind === 'wizard') {
    add('zone', 120, 80, 1200, 100, '① 选文件 / 选模板');
    add('zone', 120, 220, 1200, 160, '② 挑要处理的内容（表格按表头勾选）');
    add('zone', 120, 420, 1200, 110, '③ 先看 dry-run 报告');
    add('button', 120, 560, 160, 40, '出验证版核对');
    add('button', 300, 560, 160, 40, '出正式版');
  }
  selected = null;
  render();
});

load();
if (!items.length) {
  document.getElementById('preset').value = 'sidebar';
  document.getElementById('preset').dispatchEvent(new Event('change'));
} else {
  render();
}
setInterval(save, 2000);
</script>
</body>
</html>
