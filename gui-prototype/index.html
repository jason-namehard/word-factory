<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>word 工厂 · GUI 布局设计稿</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 14px/1.6 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
         color: #1f2933; background: #eef1f5; display: flex; flex-direction: column; }
  header { background: #fff; border-bottom: 1px solid #d7dee8; }
  #bar1 { display: flex; align-items: center; gap: 10px; padding: 9px 16px; flex-wrap: wrap; }
  #bar1 h1 { font-size: 16px; margin: 0 8px 0 0; font-weight: 600; }
  #bar1 .hint { color: #64748b; font-size: 12px; }
  #bar1 .spacer { margin-left: auto; }
  #bar2 { display: flex; align-items: center; gap: 6px; padding: 8px 16px;
          border-top: 1px solid #eef1f5; flex-wrap: wrap; background: #fcfdff; }
  #bar2 .group { display: flex; gap: 4px; align-items: center; padding-right: 10px;
                 margin-right: 4px; border-right: 1px solid #e8edf5; }
  #bar2 .group:last-child { border-right: none; }
  #bar2 .cap { font-size: 12px; color: #94a3b8; margin-right: 2px; }
  button, select { font: inherit; padding: 5px 11px; border-radius: 6px; cursor: pointer;
                   border: 1px solid #c7d0dd; background: #fff; color: #1f2933; }
  button:hover { background: #f4f7fb; }
  button.primary { background: #2f6fed; border-color: #2f6fed; color: #fff; }
  button.primary:hover { background: #2a62d4; }
  button.ghost { border-style: dashed; color: #64748b; }
  button.on { background: #eef4ff; border-color: #2f6fed; color: #1d4fd7; }
  main { flex: 1; display: flex; min-height: 0; }
  #palette { width: 148px; background: #fff; border-right: 1px solid #d7dee8;
             padding: 12px 10px; overflow: auto; }
  #palette h2 { font-size: 12px; color: #64748b; margin: 0 0 8px; }
  #palette .chip { display: block; width: 100%; text-align: left; margin-bottom: 5px;
                   font: inherit; font-size: 12px; color: #1f2933; padding: 6px 8px;
                   border: 1px solid #d7dee8; background: #fbfcfe; border-radius: 6px; }
  #palette .chip:hover { background: #eef4ff; border-color: #b9cdf5; }
  #legend .legend-row { font-size: 11px; color: #475569; padding: 4px 6px; border-radius: 5px;
                        cursor: pointer; white-space: nowrap; overflow: hidden;
                        text-overflow: ellipsis; }
  #legend .legend-row:hover { background: #fffbeb; color: #92600a; }
  #legend .legend-row.on { background: #eef4ff; color: #1d4fd7; font-weight: 600; }
  #stage-wrap { flex: 1; overflow: auto; padding: 18px; background: #e9edf3; }
  #stage { display: block; background: #fff; box-shadow: 0 1px 5px rgba(31,41,51,.12); }
  #inspector { width: 268px; background: #fff; border-left: 1px solid #d7dee8;
               padding: 14px; overflow: auto; }
  #inspector h2 { font-size: 12px; color: #64748b; margin: 0 0 10px; }
  #inspector label { display: block; font-size: 12px; color: #64748b; margin: 10px 0 4px; }
  #inspector input[type=text], #inspector input[type=number] {
    width: 100%; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; }
  #inspector .empty { color: #9aa7b8; font-size: 12px; }
  #inspector .desc { font-size: 12px; color: #92600a; background: #fffbeb;
                     border: 1px solid #f0d9a8; border-radius: 6px; padding: 8px 10px; }
  #inspector textarea { width: 100%; padding: 6px 8px; border: 1px solid #cbd5e1;
                        border-radius: 6px; font: inherit; }
  footer { background: #fff; border-top: 1px solid #d7dee8; padding: 8px 16px;
           color: #64748b; font-size: 12px; display: flex; gap: 16px; flex-wrap: wrap; }
  code { background: #f1f5f9; padding: 1px 5px; border-radius: 4px; }
  .guide { stroke: #f05f6b; stroke-width: 1; stroke-dasharray: 4 3; }
  .note-line { stroke: #f0a500; stroke-width: 1; }
</style>
</head>
<body>
<header>
  <div id="bar1">
    <h1>word 工厂 · GUI 布局</h1>
    <span class="hint">SVG 画布 1440×900（= 软件窗口外框，1 单位 = 1 像素）｜ 元件画成真实控件的样子</span>
    <span class="spacer"></span>
    <button id="undo" class="ghost">撤销</button>
    <button id="clear" class="ghost">清空</button>
    <button id="export">导出布局</button>
    <button id="import" class="ghost">导入</button>
    <button id="approve" class="primary">就是它了（存下这版）</button>
  </div>
  <div id="bar2">
    <div class="group">
      <span class="cap">布局</span>
      <select id="preset">
        <option value="">— 换一个布局 —</option>
        <option value="design">设计稿（我排的这一版）</option>
        <option value="sidebar">左栏 + 主区</option>
        <option value="toolbar">顶部工具条 + 主区</option>
        <option value="wizard">单列向导式</option>
        <option value="blank">空白画布</option>
      </select>
      <button id="notes-toggle" class="on">选中元件显示说明</button>
    </div>
    <div class="group">
      <span class="cap">贴齐</span>
      <button data-align="left">贴左</button>
      <button data-align="hcenter">水平居中</button>
      <button data-align="right">贴右</button>
      <button data-align="top">贴上</button>
      <button data-align="vcenter">垂直居中</button>
      <button data-align="bottom">贴下</button>
    </div>
    <div class="group">
      <span class="cap">复制</span>
      <button id="duplicate">复制选中（Ctrl+D）</button>
      <button id="same-size">与画布同宽</button>
    </div>
    <div class="group">
      <span class="cap">缩放</span>
      <button id="zoomout">−</button><button id="zoomin">＋</button>
      <button id="zoomfit">适应窗口</button>
    </div>
  </div>
</header>

<main>
  <aside id="palette">
    <h2>点一下加元件</h2>
    <h2 style="margin-top:14px">这一版有什么</h2>
    <div id="legend"></div>
  </aside>

  <div id="stage-wrap">
    <svg id="stage" width="1440" height="900" viewBox="0 0 1440 900"
         xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <aside id="inspector">
    <h2>属性（选中元件的文字/位置/大小）</h2>
    <div id="inspector-body" class="empty">点画布里的元件 → 这里改</div>
    <h2 style="margin-top:18px">这个元件是干什么的</h2>
    <div id="desc-body" class="empty">选中元件后这里显示它的用途</div>
    <h2 style="margin-top:18px">备注（会一起导出）</h2>
    <textarea id="notes" rows="5" placeholder="想改哪儿写这儿，比如：表格清单要显示行数 / 运行日志要能折叠…"></textarea>
  </aside>
</main>

<footer>
  <span>拖动移动（吸附 8px；靠近别的元件边缘出红色参考线）</span>
  <span>右下角小方块拉大小 ｜ 方向键微调（Shift 一次 10）</span>
  <span><code>Ctrl+D</code> 复制 ｜ <code>Delete</code> 删除 ｜ <code>Ctrl+Z</code> 撤销</span>
  <span id="status">画布是空的</span>
</footer>

<script>
'use strict';
const STAGE = document.getElementById('stage');
const STATUS = document.getElementById('status');
const INSPECTOR = document.getElementById('inspector-body');
const DESC = document.getElementById('desc-body');
const GRID = 8, CW = 1440, CH = 900;
const SVGNS = 'http://www.w3.org/2000/svg';
let items = [], selected = null, history = [], seq = 1, zoom = 1, showNotes = true;

const TYPE_LABEL = {
  zone: '分区/面板', button: '按钮', tab: '标签页', checkbox: '复选框', select: '下拉选择',
  list: '清单', 'table-list': '表格清单', 'style-picker': '模板选择器', preview: '预览窗',
  log: '日志/报告', label: '文字标签', statusbar: '状态条',
};
/* 每个元件的用途说明 —— 选中或开「说明」时给用户看，他知道这块是干什么的 */
const TYPE_DESC = {
  zone: '分区/面板：把一类内容框在一起（侧栏、主工作区、右侧预览区…）',
  button: '按钮：一个动作（运行 dry-run / 出验证版 / 出正式版 / 体检 / 导出 PDF）',
  tab: '标签页：切换主工作区里显示哪个功能',
  checkbox: '复选框：勾选要不要跑这一项',
  select: '下拉选择：从固定选项里挑一个',
  list: '清单：可勾选 + 可拖排序的功能列表',
  'table-list': '表格清单：按表头列出文档里每张表，勾选哪几张要套模板',
  'style-picker': '模板选择器：6 个表格模板缩略图，点一个套到勾选的表上',
  preview: '预览窗：套用后的样子（先生成一份给你用 Word 看）',
  log: '日志/报告：每步改了多少处、动了哪些部件',
  label: '文字标签：说明性文字',
  statusbar: '状态条：显示当前文件、选中了几张表之类的状态',
};
const DEFAULT_TEXT = {
  zone: '分区 / 面板', button: '按钮', tab: '标签页', checkbox: '复选框', select: '请选择',
  list: '清单（勾选 + 拖排序）', 'table-list': '按表头勾选表格', 'style-picker': '表格模板',
  preview: '预览窗', log: '运行日志', label: '标签', statusbar: '状态条',
};

/* ---------------------------------------------------------------- SVG 小工具 */
function el(name, attrs, text) {
  const node = document.createElementNS(SVGNS, name);
  for (const key in (attrs || {})) {
    if (attrs[key] !== undefined && attrs[key] !== null) node.setAttribute(key, attrs[key]);
  }
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}

/** 把一个元件画成"真实控件的样子" —— 所见即所得。 */
function paint(item) {
  const accent = item.id === selected;
  const isPanel = ['zone', 'preview', 'log', 'table-list', 'style-picker', 'list',
                   'statusbar'].includes(item.type);
  const group = el('g', {'data-id': item.id, cursor: 'move'});
  group.appendChild(el('rect', {
    x: item.x, y: item.y, width: item.w, height: item.h,
    rx: (item.type === 'button' || item.type === 'tab') ? 6 : 5,
    fill: isPanel ? '#fbfcfe' : '#ffffff',
    stroke: accent ? '#2f6fed' : '#cbd5e1', 'stroke-width': accent ? 2 : 1,
    'stroke-dasharray': (item.type === 'zone' || item.type === 'statusbar') ? '5 3' : undefined,
  }));

  if (item.type === 'table-list') {
    group.appendChild(el('rect', {x: item.x, y: item.y, width: item.w, height: 26,
                                  fill: '#eef3fb', rx: 5}));
    group.appendChild(el('text', {x: item.x + 10, y: item.y + 18, 'font-size': 12,
                                  'font-weight': 600, fill: '#334155'}, item.text));
    ['☑ 水位（m） / 库容（万m3）', '☑ 序号 / 高程 / 面积',
     '☐ 设计频率 / P=3.3% / P=0.33%', '☐ 项目 / 特性指标 / 单位'].forEach((row, index) =>
      group.appendChild(el('text', {x: item.x + 10, y: item.y + 48 + index * 24,
                                    'font-size': 12, fill: '#475569'}, row)));
  } else if (item.type === 'style-picker') {
    group.appendChild(el('text', {x: item.x + 10, y: item.y + 18, 'font-size': 12,
                                  'font-weight': 600, fill: '#334155'}, item.text));
    const cellW = (item.w - 22) / 3 - 6, cellH = (item.h - 40) / 2 - 5;
    ['外粗内细', '全居中', '均布列宽', '自适应', '三线表', '三线表·均布'].forEach((name, index) => {
      const cx = item.x + 11 + (index % 3) * (cellW + 6);
      const cy = item.y + 32 + Math.floor(index / 3) * (cellH + 6);
      group.appendChild(el('rect', {x: cx, y: cy, width: cellW, height: cellH, rx: 3,
                                    fill: '#fff', stroke: '#d7dee8'}));
      group.appendChild(el('text', {x: cx + cellW / 2, y: cy + cellH / 2 + 4, 'font-size': 11,
                                    fill: '#475569', 'text-anchor': 'middle'}, name));
    });
  } else if (item.type === 'preview') {
    group.appendChild(el('text', {x: item.x + 10, y: item.y + 18, 'font-size': 12,
                                  'font-weight': 600, fill: '#334155'}, item.text));
    const tx = item.x + 10, ty = item.y + 34, tw = item.w - 20;
    group.appendChild(el('rect', {x: tx, y: ty, width: tw, height: 26, fill: '#fff',
                                  stroke: '#94a3b8'}));
    group.appendChild(el('line', {x1: tx, y1: ty + 26, x2: tx + tw, y2: ty + 26,
                                  stroke: '#111827', 'stroke-width': 1.5}));
    group.appendChild(el('text', {x: tx + tw / 4, y: ty + 18, 'font-size': 11,
                                  'text-anchor': 'middle', 'font-weight': 600}, '项目'));
    group.appendChild(el('text', {x: tx + tw * 0.75, y: ty + 18, 'font-size': 11,
                                  'text-anchor': 'middle', 'font-weight': 600}, '说明'));
    group.appendChild(el('text', {x: tx + tw / 4, y: ty + 46, 'font-size': 11,
                                  'text-anchor': 'middle'}, '防洪标准'));
    group.appendChild(el('text', {x: tx + tw * 0.75, y: ty + 46, 'font-size': 11},
                         '按50年一遇设计、200年一遇校核…'));
  } else if (item.type === 'log') {
    group.appendChild(el('text', {x: item.x + 10, y: item.y + 18, 'font-size': 12,
                                  'font-weight': 600, fill: '#334155'}, item.text));
    ['· 表格 12 张，改了 12 张（131 处）',
     '· 单元格对齐(left) 9 处 ｜ 框线 12 处 ｜ 表头折行 1 处',
     '· 只重写 word/document.xml，其余 41 个部件逐字节未变'].forEach((line, index) =>
      group.appendChild(el('text', {x: item.x + 10, y: item.y + 42 + index * 22,
                                    'font-size': 11, fill: '#64748b',
                                    'font-family': 'Consolas, monospace'}, line)));
  } else if (item.type === 'list') {
    group.appendChild(el('text', {x: item.x + 10, y: item.y + 18, 'font-size': 12,
                                  'font-weight': 600, fill: '#334155'}, item.text));
    ['☑ 格式规范化（变黑+字体+上下标）', '☑ 表格款式（6 套模板）', '☑ 文本替换 + 对齐',
     '☑ 一键整理（去空格/空行）', '☐ 段落配方（xlsx 数据表）', '☐ 体检 AUDIT'].forEach((row, index) =>
      group.appendChild(el('text', {x: item.x + 10, y: item.y + 40 + index * 22,
                                    'font-size': 11, fill: '#475569'}, row)));
  } else if (item.type === 'checkbox') {
    group.appendChild(el('rect', {x: item.x, y: item.y + 5, width: 14, height: 14, rx: 3,
                                  fill: '#fff', stroke: '#64748b'}));
    group.appendChild(el('text', {x: item.x + 20, y: item.y + 18, 'font-size': 13}, item.text));
  } else if (item.type === 'select') {
    group.appendChild(el('rect', {x: item.x, y: item.y, width: item.w, height: item.h,
                                  rx: 5, fill: '#fff', stroke: '#cbd5e1'}));
    group.appendChild(el('text', {x: item.x + 10, y: item.y + 23, 'font-size': 13,
                                  fill: '#475569'}, item.text));
    group.appendChild(el('text', {x: item.x + item.w - 14, y: item.y + 23, 'font-size': 10,
                                  fill: '#94a3b8', 'text-anchor': 'middle'}, '▼'));
  } else if (item.type === 'tab') {
    group.appendChild(el('rect', {x: item.x, y: item.y + 2, width: item.w, height: item.h - 3,
                                  rx: 5, fill: '#fff', stroke: '#cbd5e1'}));
    group.appendChild(el('line', {x1: item.x, y1: item.y + item.h - 1,
                                  x2: item.x + item.w, y2: item.y + item.h - 1,
                                  stroke: '#fff', 'stroke-width': 3}));
    group.appendChild(el('text', {x: item.x + item.w / 2, y: item.y + 23, 'font-size': 13,
                                  'text-anchor': 'middle'}, item.text));
  } else if (item.type === 'label' || item.type === 'statusbar') {
    group.appendChild(el('text', {x: item.x + 10, y: item.y + item.h / 2 + 5, 'font-size': 12,
                                  fill: '#64748b'}, item.text));
  } else {
    const centered = item.type === 'button';
    group.appendChild(el('text', {
      x: centered ? item.x + item.w / 2 : item.x + 10,
      y: item.y + item.h / 2 + 5, 'font-size': 13,
      'text-anchor': centered ? 'middle' : 'start',
    }, item.text));
  }
  if (item.id === selected) {
    group.appendChild(el('rect', {x: item.x + item.w - 9, y: item.y + item.h - 9,
                                  width: 9, height: 9, fill: '#2f6fed',
                                  cursor: 'nwse-resize', 'data-handle': '1'}));
  }
  return group;
}

function render() {
  STAGE.textContent = '';
  STAGE.appendChild(el('rect', {x: 0, y: 0, width: CW, height: CH,
                                fill: '#fff', stroke: '#94a3b8'}));
  for (let x = 0; x <= CW; x += 80) STAGE.appendChild(
    el('line', {x1: x, y1: 0, x2: x, y2: CH, stroke: '#f2f5f9'}));
  for (let y = 0; y <= CH; y += 80) STAGE.appendChild(
    el('line', {x1: 0, y1: y, x2: CW, y2: y, stroke: '#f2f5f9'}));
  items.forEach(item => STAGE.appendChild(paint(item)));
  const noted = showNotes && items.find(entry => entry.id === selected);
  if (noted) STAGE.appendChild(annotation(noted));
  STAGE.appendChild(el('g', {id: 'guides'}));
  STATUS.textContent = items.length ? ('画布上有 %d 个元件').replace('%d', items.length)
                                    : '画布是空的 —— 从上面选个预设布局';
  renderLegend();
  renderInspector();
}

/** 左侧「这一版有什么」清单：鼠标指上去画布里对应元件高亮，点一下选中。 */
function renderLegend() {
  const holder = document.getElementById('legend');
  if (!holder) return;
  holder.textContent = '';
  items.forEach(item => {
    const row = document.createElement('div');
    row.className = 'legend-row' + (item.id === selected ? ' on' : '');
    row.dataset.id = item.id;
    row.title = (item.desc || TYPE_DESC[item.type] || '');
    row.textContent = (TYPE_LABEL[item.type] || item.type) + ' | ' + String(item.text).slice(0, 14);
    row.addEventListener('mouseenter', () => {
      const node = STAGE.querySelector('g[data-id="' + item.id + '"] rect');
      if (node) node.setAttribute('stroke', '#f0a500');
    });
    row.addEventListener('mouseleave', () => {
      const node = STAGE.querySelector('g[data-id="' + item.id + '"] rect');
      if (node) node.setAttribute('stroke', item.id === selected ? '#2f6fed' : '#cbd5e1');
    });
    row.addEventListener('click', () => { selected = item.id; render(); });
    holder.appendChild(row);
  });
}

/** 说明气泡：告诉用户这块是干什么的（开「说明」时出现）。 */
function annotation(item) {
  const group = el('g', {'data-note': item.id});
  const text = item.desc || TYPE_DESC[item.type] || '界面元件';
  const boxW = Math.min(340, 16 + text.length * 7.2);
  let bx = item.x + item.w + 12;
  const by = item.y + item.h - 30;
  if (bx + boxW > CW - 4) bx = Math.max(4, item.x - boxW - 12);
  group.appendChild(el('line', {x1: bx < item.x ? bx + boxW : bx, y1: by + 13,
                                x2: bx < item.x ? item.x : item.x + item.w,
                                y2: item.y + item.h / 2, class: 'note-line'}));
  group.appendChild(el('rect', {x: bx, y: by, width: boxW, height: 26, rx: 4,
                                fill: '#fffbeb', stroke: '#f0a500', 'stroke-width': 0.8}));
  group.appendChild(el('text', {x: bx + 7, y: by + 17, 'font-size': 11, fill: '#92600a'},
                       text.slice(0, 46)));
  return group;
}

/* ---------------------------------------------------------------- 坐标换算 */
function toSvg(event) {
  const point = STAGE.createSVGPoint();
  point.x = event.clientX;
  point.y = event.clientY;
  return point.matrixTransform(STAGE.getScreenCTM().inverse());
}

/* ---------------------------------------------------------------- 拖动 / 改大小 */
STAGE.addEventListener('mousedown', event => {
  const handle = event.target.getAttribute && event.target.getAttribute('data-handle');
  const group = event.target.closest('g[data-id]');
  if (!group) { selected = null; render(); return; }
  const item = items.find(entry => entry.id === group.getAttribute('data-id'));
  if (!item) return;
  selected = item.id;
  render();
  const start = toSvg(event);
  const origin = {x: item.x, y: item.y, w: item.w, h: item.h};
  let moved = false;
  const move = ev => {
    const point = toSvg(ev);
    moved = true;
    if (handle) {
      item.w = clamp(round8(origin.w + point.x - start.x), 40, CW - item.x);
      item.h = clamp(round8(origin.h + point.y - start.y), 24, CH - item.y);
    } else {
      item.x = clamp(round8(origin.x + point.x - start.x), 0, CW - item.w);
      item.y = clamp(round8(origin.y + point.y - start.y), 0, CH - item.h);
      snap(item);
      drawGuides(item);
    }
    const node = STAGE.querySelector('g[data-id="' + item.id + '"]');
    if (node) { node.remove(); STAGE.insertBefore(paint(item), STAGE.lastChild); }
  };
  const up = () => {
    document.removeEventListener('mousemove', move);
    document.removeEventListener('mouseup', up);
    const guides = document.getElementById('guides');
    if (guides) guides.textContent = '';
    render();
    if (moved) pushHistorySoon();
  };
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', up);
});

function snap(item) {
  const guides = [];
  const near = (a, b) => Math.abs(a - b) <= 5;
  for (const other of items) {
    if (other.id === item.id) continue;
    [other.x, other.x + other.w, (other.x * 2 + other.w) / 2].forEach(value =>
      [item.x, item.x + item.w, (item.x * 2 + item.w) / 2].forEach(mine => {
        if (near(mine, value)) guides.push(['v', value]);
      }));
    [other.y, other.y + other.h, (other.y * 2 + other.h) / 2].forEach(value =>
      [item.y, item.y + item.h, (item.y * 2 + item.h) / 2].forEach(mine => {
        if (near(mine, value)) guides.push(['h', value]);
      }));
  }
  if (near(item.x, CW / 2)) guides.push(['v', CW / 2]);
  if (near(item.y, CH / 2)) guides.push(['h', CH / 2]);
  for (const guide of guides) {
    if (guide[0] === 'v') item.x = clamp(guide[1], 0, CW - item.w);
    else item.y = clamp(guide[1], 0, CH - item.h);
  }
}

function drawGuides(item) {
  const guides = document.getElementById('guides');
  if (!guides) return;
  guides.textContent = '';
  if (Math.abs(item.x + item.w / 2 - CW / 2) < 2) {
    guides.appendChild(el('line', {x1: CW / 2, y1: 0, x2: CW / 2, y2: CH, class: 'guide'}));
  }
  if (Math.abs(item.y + item.h / 2 - CH / 2) < 2) {
    guides.appendChild(el('line', {x1: 0, y1: CH / 2, x2: CW, y2: CH / 2, class: 'guide'}));
  }
}

function round8(value) { return Math.round(value / GRID) * GRID; }
function clamp(value, low, high) { return Math.max(low, Math.min(high, value)); }

/* ---------------------------------------------------------------- 加元件 */
const PALETTE = [
  ['zone', '分区/面板'], ['button', '按钮'], ['tab', '标签页'], ['checkbox', '复选框'],
  ['select', '下拉选择'], ['list', '清单'], ['table-list', '表格清单'],
  ['style-picker', '模板选择器'], ['preview', '预览窗'], ['log', '日志/报告'],
  ['label', '文字标签'], ['statusbar', '状态条'],
];
const PALETTE_SIZE = {zone: [240, 200], button: [120, 34], tab: [118, 34], checkbox: [120, 28],
                      select: [150, 34], list: [240, 180], 'table-list': [300, 200],
                      'style-picker': [240, 150], preview: [240, 160], log: [420, 110],
                      label: [160, 28], statusbar: [300, 30]};
PALETTE.forEach(entry => {
  const button = document.createElement('button');
  button.className = 'chip';
  button.dataset.add = entry[0];
  button.textContent = entry[1];
  button.addEventListener('click', () => {
    pushHistory();
    const type = button.dataset.add;
    const size = PALETTE_SIZE[type];
    const item = {id: 'i' + (seq++), type: type,
                  x: round8(Math.max(0, (CW - size[0]) / 2)),
                  y: round8(Math.max(0, (CH - size[1]) / 2)),
                  w: size[0], h: size[1], text: DEFAULT_TEXT[type] || type, desc: null};
    items.push(item);
    selected = item.id;
    render();
  });
  document.getElementById('palette').appendChild(button);
});

/* ---------------------------------------------------------------- 属性面板 */
function renderInspector() {
  const item = items.find(entry => entry.id === selected);
  if (!item) {
    INSPECTOR.className = 'empty';
    INSPECTOR.textContent = '点画布里的元件 → 这里改';
    DESC.className = 'empty';
    DESC.textContent = '选中元件后这里显示它的用途';
    return;
  }
  INSPECTOR.className = '';
  INSPECTOR.innerHTML =
    '<label>类型</label><div><b>' + escapeHtml(TYPE_LABEL[item.type] || item.type) + '</b></div>'
    + '<label>文字</label><input type="text" id="f-text" value="' + escapeHtml(item.text) + '">'
    + '<label>X</label><input type="number" id="f-x" value="' + item.x + '" step="8">'
    + '<label>Y</label><input type="number" id="f-y" value="' + item.y + '" step="8">'
    + '<label>宽</label><input type="number" id="f-w" value="' + item.w + '" step="8">'
    + '<label>高</label><input type="number" id="f-h" value="' + item.h + '" step="8">'
    + '<div style="margin-top:12px"><button id="f-del" class="ghost">删除这个元件</button></div>';
  const bind = (id, key, parse) => document.getElementById(id).addEventListener('input', e => {
    item[key] = parse ? parse(e.target.value) : e.target.value;
    render();
  });
  bind('f-text', 'text');
  bind('f-x', 'x', v => clamp(round8(+v || 0), 0, CW - item.w));
  bind('f-y', 'y', v => clamp(round8(+v || 0), 0, CH - item.h));
  bind('f-w', 'w', v => clamp(round8(+v || 0), 40, CW - item.x));
  bind('f-h', 'h', v => clamp(round8(+v || 0), 24, CH - item.y));
  document.getElementById('f-del').addEventListener('click', () => {
    pushHistory();
    items = items.filter(entry => entry.id !== selected);
    selected = null;
    render();
  });
  DESC.className = 'desc';
  DESC.textContent = item.desc || TYPE_DESC[item.type] || '（这个类型没有说明）';
}

function escapeHtml(text) {
  return String(text === undefined || text === null ? '' : text)
    .replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
}

/* ---------------------------------------------------------------- 键盘 */
document.addEventListener('keydown', event => {
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;
  const item = items.find(entry => entry.id === selected);
  if (!item) return;
  const step = event.shiftKey ? GRID * 10 : GRID;
  const moves = {ArrowLeft: [-step, 0], ArrowRight: [step, 0],
                 ArrowUp: [0, -step], ArrowDown: [0, step]};
  if (moves[event.key]) {
    event.preventDefault();
    item.x = clamp(item.x + moves[event.key][0], 0, CW - item.w);
    item.y = clamp(item.y + moves[event.key][1], 0, CH - item.h);
    render();
  } else if (event.key === 'Delete') {
    items = items.filter(entry => entry.id !== selected);
    selected = null;
    render();
  } else if (event.key === 'z' && (event.ctrlKey || event.metaKey)) {
    event.preventDefault();
    undo();
  } else if (event.key === 'd' && (event.ctrlKey || event.metaKey)) {
    event.preventDefault();
    duplicate();
  }
});

/* ---------------------------------------------------------------- 贴齐 / 复制 */
function duplicate() {
  const item = items.find(entry => entry.id === selected);
  if (!item) return;
  pushHistory();
  const copy = Object.assign({}, item, {id: 'i' + (seq++)});
  copy.x = clamp(round8(item.x + 16), 0, CW - item.w);
  copy.y = clamp(round8(item.y + 16), 0, CH - item.h);
  items.push(copy);
  selected = copy.id;
  render();
}

document.getElementById('duplicate').addEventListener('click', duplicate);
document.getElementById('same-size').addEventListener('click', () => {
  const item = items.find(entry => entry.id === selected);
  if (!item) return;
  pushHistory();
  item.w = CW;
  item.x = 0;
  render();
});
document.querySelectorAll('[data-align]').forEach(button => {
  button.addEventListener('click', () => {
    const item = items.find(entry => entry.id === selected);
    if (!item) return;
    pushHistory();
    const mode = button.dataset.align;
    if (mode === 'left') item.x = 0;
    else if (mode === 'right') item.x = CW - item.w;
    else if (mode === 'hcenter') item.x = round8((CW - item.w) / 2);
    else if (mode === 'top') item.y = 0;
    else if (mode === 'bottom') item.y = CH - item.h;
    else if (mode === 'vcenter') item.y = round8((CH - item.h) / 2);
    render();
  });
});

/* ---------------------------------------------------------------- 缩放 / 说明开关 */
function setZoom(value) {
  zoom = clamp(value, 0.25, 2);
  STAGE.setAttribute('width', CW * zoom);
  STAGE.setAttribute('height', CH * zoom);
}
document.getElementById('zoomin').addEventListener('click', () => setZoom(zoom + 0.15));
document.getElementById('zoomout').addEventListener('click', () => setZoom(zoom - 0.15));
document.getElementById('zoomfit').addEventListener('click', () => setZoom(1));
document.getElementById('notes-toggle').addEventListener('click', event => {
  showNotes = !showNotes;
  event.target.classList.toggle('on', !showNotes);
  event.target.textContent = showNotes ? '隐藏说明' : '显示说明';
  render();
});

/* ---------------------------------------------------------------- 工具 */
let historyTimer = null;
function pushHistorySoon() {
  clearTimeout(historyTimer);
  historyTimer = setTimeout(() => { history.push(JSON.stringify(items)); }, 400);
}
function pushHistory() {
  history.push(JSON.stringify(items));
  if (history.length > 80) history.shift();
}
function undo() {
  if (!history.length) return;
  items = JSON.parse(history.pop());
  selected = null;
  render();
}
function save() {
  localStorage.setItem('wordfactory-svg-layout', JSON.stringify(
    {layout: items, notes: document.getElementById('notes').value, zoom: zoom}));
}
function load() {
  try {
    const raw = localStorage.getItem('wordfactory-svg-layout');
    if (!raw) return;
    const data = JSON.parse(raw);
    items = data.layout || [];
    if (data.notes) document.getElementById('notes').value = data.notes;
    if (data.zoom) setZoom(data.zoom);
    seq = nextSeq();
    renumber();
  } catch (error) { items = []; }
}
function nextSeq() {
  let max = 0;
  items.forEach(item => {
    const n = parseInt(String(item.id || '').replace(/\D/g, ''), 10);
    if (!isNaN(n) && n > max) max = n;
  });
  return max + 1;
}
function renumber() {
  const seen = new Set();
  items.forEach(item => {
    if (!item.id || seen.has(item.id)) item.id = 'i' + (seq++);
    seen.add(item.id);
  });
}

document.getElementById('undo').addEventListener('click', undo);
document.getElementById('clear').addEventListener('click', () => {
  if (!confirm('清空画布上所有元件？')) return;
  pushHistory();
  items = [];
  selected = null;
  render();
});
document.getElementById('export').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(
    {layout: items, notes: document.getElementById('notes').value}, null, 2)],
    {type: 'application/json'});
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'wordfactory-gui-layout.json';
  link.click();
  URL.revokeObjectURL(link.href);
});
document.getElementById('import').addEventListener('click', () => {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.addEventListener('change', () => {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        pushHistory();
        const data = JSON.parse(reader.result);
        items = data.layout || [];
        if (data.notes) document.getElementById('notes').value = data.notes;
        seq = nextSeq();
        renumber();
        selected = null;
        render();
      } catch (error) { alert('这个 JSON 读不动：' + error.message); }
    };
    reader.readAsText(file);
  });
  input.click();
});
document.getElementById('approve').addEventListener('click', () => {
  save();
  alert('已存下这版（浏览器里也记住）。\n\n点「导出布局」把 JSON 发我，我照它做真界面。');
});

    add('button', 560, 33, 118, 34, '导出 PDF', '编排外部渲染器出 PDF');
    add('label', 1180, 33, 236, 34, '文件：欧峪水库防洪安全复核报告.docx', null);
    add('zone', 24, 100, 260, 560, '侧栏：可跑的功能', '勾选要跑哪些 + 拖排序；下面进规则文件');
    add('list', 40, 152, 228, 300, '宏清单（勾选 + 拖排序）', '每个宏是一个具名修改步骤');

    add('button', 40, 526, 228, 34, '存为配方', '把当前勾选+顺序存起来，下次一键跑');

    add('log', 308, 680, 760, 144, '运行日志', '过程输出：跑没跑、报没报错');

  } else if (kind === 'sidebar') {
    add('zone', 20, 60, 220, 400, '侧栏：宏库 / 表格 / 规则 / 体检');

    add('log', 260, 440, 700, 110, '运行日志');
    add('button', 990, 70, 130, 34, '运行（dry-run）');
    add('button', 990, 130, 130, 34, '出验证版');
    add('button', 990, 190, 130, 34, '出正式版');
    add('button', 990, 250, 130, 34, '体检 AUDIT');
  } else if (kind === 'toolbar') {
    add('zone', 20, 60, 1400, 60, '顶部工具条');
    add('tab', 40, 70, 130, 34, '格式规范化');

    add('tab', 490, 70, 130, 34, '规则文件');
    add('zone', 20, 150, 900, 380, '主工作区');
    add('zone', 940, 150, 480, 380, '右侧：日志 / 预览');
  } else if (kind === 'wizard') {
    add('zone', 120, 80, 1200, 100, '① 选文件 / 选模板');

    add('button', 300, 560, 160, 40, '出正式版');
  }
  selected = null;
  render();
});

load();
if (!items.length) {
  document.getElementById('preset').value = 'design';
  document.getElementById('preset').dispatchEvent(new Event('change'));
} else {
  render();
}
setInterval(save, 2000);
</script>
